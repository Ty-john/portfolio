<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tyrone John Zapata | IT Student & Technical Builder</title>
    <meta name="description" content="Portfolio of Tyrone John Zapata — Fourth-year BSIT student bridging interactive frontends, clean database architectures, and pragmatic systems automation." />
    <meta name="keywords" content="Tyrone John Zapata, IT Portfolio, BSIT, Frontend Developer, Systems Automation, Metro Manila, Flutter, React" />
    <meta name="author" content="Tyrone John Zapata" />

    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tyrone John Zapata | IT Student & Technical Builder" />
    <meta property="og:description" content="Bridging practical code, database architectures, and pragmatic workflow automations." />
    <meta property="twitter:card" content="summary_large_image" />

    <!-- Theme Color: Dynamically updated via ThemeContext -->
    <meta name="theme-color" id="meta-theme-color" content="#FBF8F1" />

    <!-- Theme initialization script to prevent flash of incorrect theme before first paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#0B1F3A');
          } else {
            document.documentElement.classList.remove('dark');
            var metaLight = document.getElementById('meta-theme-color');
            if (metaLight) metaLight.setAttribute('content', '#FBF8F1');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: Libre Baskerville (400 Regular and Italic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] font-serif font-normal antialiased selection:bg-[#C9A227]/25 selection:text-[#0B1F3A]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
